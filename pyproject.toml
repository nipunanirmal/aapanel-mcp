[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aapanel-mcp"
version = "1.0.0"
description = "Full-featured MCP server for aaPanel management"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
aapanel-mcp = "aapanel_mcp.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aapanel_mcp*"]
