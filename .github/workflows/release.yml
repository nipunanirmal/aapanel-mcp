name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package aaPanel Terminal Bridge
        working-directory: plugin/mcp_terminal
        run: zip -r ../../mcp_terminal.zip .
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mcp_terminal.zip
